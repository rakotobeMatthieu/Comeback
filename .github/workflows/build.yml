name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # La clé de signature vient du secret SIGNING_KEY (keystore en base64).
      # Sans elle, l'app est compilée pour vérification mais aucune version n'est publiée.
      - name: Clé de signature
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/comeback.jks"
            keytool -list -keystore "$RUNNER_TEMP/comeback.jks" -storepass comeback-app > /dev/null \
              || { echo "::error::Le secret SIGNING_KEY est invalide (copie incomplète ?)"; exit 1; }
            echo "SIGNING_KEY_FILE=$RUNNER_TEMP/comeback.jks" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Tests et compilation
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Publier la version (APK)
        if: success() && env.HAS_KEY == 'true' && !contains(github.event.head_commit.message, '[no-release]')
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          APK="ComeBack-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v${VERSION_NAME}" "$APK" \
            --title "ComeBack ${VERSION_NAME}" \
            --notes "${NOTES:-Nouvelle version}" \
            --target "${{ github.sha }}"

      # Le journal est poussé sur la branche ci-logs pour pouvoir être lu sans connexion GitHub.
      - name: Journal de compilation (branche ci-logs)
        if: always()
        run: |
          mkdir -p /tmp/ci
          cp build.log /tmp/ci/build.log 2>/dev/null || echo "pas de journal" > /tmp/ci/build.log
          grep -nE "^e: |error:|FAILED|What went wrong|Exception|expected:" /tmp/ci/build.log | head -400 > /tmp/ci/errors.txt || true
          printf "run=%s\nsha=%s\nstatus=%s\nversion=%s\nsigned=%s\n" "${{ github.run_number }}" "${{ github.sha }}" "${{ job.status }}" "$VERSION_NAME" "${HAS_KEY:-false}" > /tmp/ci/status.txt
          cd /tmp/ci
          git init -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run ${{ github.run_number }} ${{ job.status }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
